name: Database
# Stable checks on every PR, suitable for required checks once adopted.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: db-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Migrations valid and immutable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, needed to diff against the base branch
      - name: Names and immutability
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/ci/check-migrations.sh
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - name: Replay every migration on a clean database
        run: |
          supabase db start
          supabase db reset --local
      - name: Run database acceptance tests when present
        run: |
          if find supabase/tests -name '*_test.sql' -print -quit | grep -q .; then
            supabase test db --local
          else
            echo "No SQL acceptance tests yet; database behavior is not verified."
          fi

  functions:
    name: Edge Functions (fmt, lint, typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Verify backend source and run unit tests
        run: bash scripts/ci/check-backend.sh
