name: Bug
description: Something behaves differently from what was intended
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Include the exact error text.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Branch or commit, and local or hosted Supabase.
